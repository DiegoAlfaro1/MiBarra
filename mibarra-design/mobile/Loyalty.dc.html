<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis tarjetas de sellos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F2; color: #1C1917; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 56px 20px 16px; overflow: hidden">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Mis sellos</h1>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 24px; background: {{accent}}; color: #FFFFFF">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase">Café Lempa</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700">6 de 8 sellos</span>
          <span style="font-size: 13px">Con 8 sellos: una bebida gratis</span>
        </div>
        <div style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700">CL</div>
      </div>
      <div role="img" aria-label="6 de 8 sellos" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{stamps}}" as="s" hint-placeholder-count="8">
          <div style="{{s.style}}">
            <sc-if value="{{s.on}}" hint-placeholder-val="{{ true }}">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"></path></svg>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 16px; background: #FFFFFF; color: #1C1917">
        <div role="img" aria-label="Código QR de tu tarjeta" style="width: 92px; height: 92px; flex-shrink: 0; display: grid; grid-template-columns: repeat(21, minmax(0, 1fr))">
          <sc-for list="{{qr}}" as="q" hint-placeholder-count="441">
            <span style="{{q}}"></span>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 700; font-size: 14px">Muéstralo en caja</span>
          <span style="font-size: 13px; color: #57534E; line-height: 1.4">Para sumar sellos en compras sin la app o canjear tu recompensa.</span>
        </div>
      </div>
    </div>

    <button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #000000; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 10h18"></path></svg>
      Agregar a Wallet
      <span style="padding: 2px 6px; border-radius: 6px; background: #1D4ED8; font-size: 10px; font-weight: 700; letter-spacing: 0.06em">VISTA PREVIA</span>
    </button>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">Otras cafeterías</h2>
      <a href="Reward.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #DCFCE7; border: 1px solid #86EFAC">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: #14532D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">TV</div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 600; font-size: 15px; color: #14532D">Tostadores del Valle</span>
          <span style="font-size: 13px; color: #14532D">¡Recompensa lista! Toca para canjear</span>
        </div>
        <span style="font-weight: 700; font-size: 15px; color: #14532D">8/8</span>
      </a>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E7E5E4">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: #3F6212; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">LM</div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="font-weight: 600; font-size: 15px">La Molienda</span>
          <div style="height: 6px; border-radius: 3px; background: #E7E5E4; overflow: hidden"><div style="width: 20%; height: 6px; background: #3F6212"></div></div>
        </div>
        <span style="font-weight: 700; font-size: 15px">2/10</span>
      </div>
    </div>
  </div>

  <nav aria-label="Navegación principal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 76px; padding-bottom: 12px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E7E5E4">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #57534E">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="Orders.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #57534E">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>Pedidos</a>
    <a href="Loyalty.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: {{accent}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="12" r="1.5"></circle><circle cx="13" cy="12" r="1.5"></circle></svg>Sellos</a>
    <a href="Login.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #57534E">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4441B","options":["#B4441B","#1D4ED8","#3F6212","#7C2D12"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#B4441B';
    const stamps = [];
    for (let i = 0; i < 8; i++) {
      const on = i < 6;
      stamps.push({ on, style: 'aspect-ratio: 1; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' +
        (on ? 'background: #FFFFFF; color: ' + accent : 'border: 2px dashed rgba(255,255,255,0.7)') });
    }
    const N = 21, qr = [];
    const finder = (r, c) => {
      for (const [r0, c0] of [[0, 0], [0, N - 7], [N - 7, 0]]) {
        const y = r - r0, x = c - c0;
        if (y >= 0 && y < 7 && x >= 0 && x < 7) return (y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4)) ? 1 : 0;
        if (y >= -1 && y <= 7 && x >= -1 && x <= 7) return 0;
      }
      return -1;
    };
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      let v = finder(r, c);
      if (v < 0) v = ((r * 7 + c * 13 + r * c * 3) % 5 < 2) ? 1 : 0;
      qr.push('aspect-ratio: 1; background: ' + (v ? '#1C1917' : 'transparent'));
    }
    return { accent, stamps, qr };
  }
}
</script>
</body>
</html>
