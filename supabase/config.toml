# Supabase CLI local development config.
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "mibarra"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Expo web dev servers (mobile on 8081, dashboard on 8082).
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8082", "mibarra://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.place-order]
verify_jwt = true
