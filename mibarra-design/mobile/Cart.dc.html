<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F2; color: #1C1917; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px">
    <a href="Menu.dc.html" aria-label="Volver al menú" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E7E5E4; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700">Tu pedido</h1>
      <span style="font-size: 13px; color: #57534E">Café Lempa · Recoger en tienda</span>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 8px 20px 150px; overflow: hidden">
    <sc-if value="{{soldOutWarning}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="display: flex; gap: 10px; padding: 14px; border-radius: 14px; background: #FEF3C7; border: 1px solid #F59E0B">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#92400E" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17h.01"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #78350F">
          <strong>El croissant se agotó</strong>
          <span>Lo quitamos de tu pedido. Tu total se actualizó.</span>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 18px; padding: 4px 16px">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
        <div style="display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid #F1EFEC">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-weight: 600; font-size: 15px">{{l.name}}</span>
            <span style="font-size: 13px; color: #57534E; line-height: 1.4">{{l.opts}}</span>
            <div style="display: flex; gap: 14px; margin-top: 4px">
              <a href="Item.dc.html" style="font-size: 13px; font-weight: 600; text-decoration: underline">Editar</a>
              <button type="button" onClick="{{l.remove}}" style="border: 0; background: none; padding: 0; font: inherit; font-size: 13px; font-weight: 600; color: #B91C1C; text-decoration: underline; cursor: pointer">Quitar</button>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
            <span style="font-weight: 700; font-size: 15px">{{l.price}}</span>
            <div style="display: flex; align-items: center; gap: 2px; border: 1px solid #E7E5E4; border-radius: 12px">
              <button type="button" aria-label="Quitar uno" onClick="{{l.dec}}" style="width: 44px; height: 40px; border: 0; background: none; font-size: 18px; cursor: pointer; color: #1C1917">−</button>
              <span style="min-width: 16px; text-align: center; font-weight: 600; font-size: 14px">{{l.qty}}</span>
              <button type="button" aria-label="Agregar uno" onClick="{{l.inc}}" style="width: 44px; height: 40px; border: 0; background: none; font-size: 18px; cursor: pointer; color: #1C1917">+</button>
            </div>
          </div>
        </div>
      </sc-for>
      <a href="Menu.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 52px; font-size: 14px; font-weight: 600; color: {{accent}}">
        <span aria-hidden="true" style="font-size: 18px">+</span> Agregar más productos
      </a>
    </div>

    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-weight: 700; font-size: 15px">Nota para la cafetería</span>
      <textarea rows="2" placeholder="Ej.: sin tapa, extra caliente" style="font: inherit; font-size: 15px; padding: 12px 14px; border-radius: 14px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; resize: none"></textarea>
    </label>

    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #F8E6DC; font-size: 14px; color: #7C2D12">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>
      <span>Este pedido suma <strong>1 sello</strong> a tu tarjeta</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 28px; background: #FFFFFF; border-top: 1px solid #E7E5E4; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; font-size: 16px">
      <span style="font-weight: 600">Total</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">{{total}}</span>
    </div>
    <a href="Login.dc.html" style="height: 56px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Continuar al pago</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4441B","options":["#B4441B","#1D4ED8","#3F6212","#7C2D12"]},"soldOutWarning":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: [1, 1] }; }
  renderVals() {
    const accent = this.props.accent ?? '#B4441B';
    const soldOutWarning = this.props.soldOutWarning ?? false;
    let base = [
      { name: 'Capuchino', opts: 'Mediano 16 oz · Leche entera · Sirope de vainilla', unit: 90 },
      { name: 'Croissant', opts: 'Horneado esta mañana', unit: 45 }
    ];
    const q = this.state.q.slice();
    let idx = base.map((_, i) => i).filter(i => q[i] > 0);
    if (soldOutWarning) idx = idx.filter(i => i !== 1);
    let sum = 0;
    const lines = idx.map(i => {
      sum += base[i].unit * q[i];
      const set = (v) => { const n = this.state.q.slice(); n[i] = v; this.setState({ q: n }); };
      return { ...base[i], qty: q[i], price: 'L ' + (base[i].unit * q[i]).toFixed(2),
        inc: () => set(Math.min(9, q[i] + 1)), dec: () => set(Math.max(1, q[i] - 1)), remove: () => set(0) };
    });
    return { accent, soldOutWarning, lines, total: 'L ' + sum.toFixed(2) };
  }
}
</script>
</body>
</html>
