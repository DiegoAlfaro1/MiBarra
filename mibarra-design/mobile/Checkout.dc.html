<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hora de recogida y pago</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F2; color: #1C1917; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px">
    <a href="Cart.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E7E5E4; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700">Confirmar pedido</h1>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 8px 20px 150px; overflow: hidden">
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">¿Cuándo pasas por él?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{slots}}" as="t" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{t.pressed}}" disabled="{{t.full}}" onClick="{{t.pick}}" style="{{t.style}}">
            <span style="font-weight: 600; font-size: 14px">{{t.label}}</span>
            <span style="font-size: 11px">{{t.sub}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">Forma de pago</h2>
      <sc-for list="{{pays}}" as="p" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="{{p.style}}">
          <span style="{{p.radio}}"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px">{{p.label}}
              <sc-if value="{{p.demo}}" hint-placeholder-val="{{ false }}"><span style="padding: 2px 6px; border-radius: 6px; background: #1D4ED8; color: #FFFFFF; font-size: 10px; font-weight: 700; letter-spacing: 0.06em">DEMO</span></sc-if>
            </span>
            <span style="font-size: 13px; color: #57534E">{{p.sub}}</span>
          </span>
        </button>
      </sc-for>
      <sc-if value="{{isCard}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #EFF6FF; border: 1px dashed #1D4ED8">
          <span style="font-size: 12px; font-weight: 700; color: #1E3A8A">Modo demo · no se realiza ningún cobro real</span>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Número de tarjeta
            <input type="text" inputmode="numeric" value="4242 4242 4242 4242" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #BFDBFE; font: inherit; font-size: 15px; font-weight: 400; color: #1C1917; background: #FFFFFF">
          </label>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Vence
              <input type="text" value="12/28" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #BFDBFE; font: inherit; font-size: 15px; font-weight: 400; color: #1C1917; background: #FFFFFF">
            </label>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">CVV
              <input type="text" value="123" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #BFDBFE; font: inherit; font-size: 15px; font-weight: 400; color: #1C1917; background: #FFFFFF">
            </label>
          </div>
        </div>
      </sc-if>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E7E5E4; font-size: 14px">
      <div style="display: flex; justify-content: space-between"><span>Capuchino mediano</span><span>L 90.00</span></div>
      <div style="display: flex; justify-content: space-between"><span>Croissant</span><span>L 45.00</span></div>
      <div style="display: flex; justify-content: space-between; color: #57534E"><span>Recoger en Café Lempa</span><span>Col. Palmira</span></div>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 28px; background: #FFFFFF; border-top: 1px solid #E7E5E4; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px; color: #57534E">{{summary}}</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">L 135.00</span>
    </div>
    <a href="Tracking.dc.html" style="height: 56px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4441B","options":["#B4441B","#1D4ED8","#3F6212","#7C2D12"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { slot: 0, pay: 'counter' }; }
  renderVals() {
    const accent = this.props.accent ?? '#B4441B';
    const s = this.state;
    const slotList = [['Lo antes posible', '~10 min'], ['9:20 a. m.', ''], ['9:30 a. m.', ''], ['9:40 a. m.', 'Lleno', true], ['9:50 a. m.', ''], ['10:00 a. m.', '']];
    const slots = slotList.map(([label, sub, full], i) => {
      const on = s.slot === i;
      return { label, sub: sub || ' ', full: !!full, pressed: String(on), pick: () => { if (!full) this.setState({ slot: i }); },
        style: 'min-height: 58px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 6px; font: inherit; text-align: center; ' +
          (full ? 'background: #F1EFEC; color: #78716C; border: 1.5px dashed #D6D3D1; cursor: not-allowed; text-decoration: line-through' :
          on ? 'background: #1C1917; color: #FFFFFF; border: 1.5px solid #1C1917; cursor: pointer' : 'background: #FFFFFF; color: #1C1917; border: 1.5px solid #E7E5E4; cursor: pointer') };
    });
    const payList = [['counter', 'Pagar en caja', 'Pagas al recoger, en efectivo o tarjeta', false], ['card', 'Tarjeta en línea', 'Se cobra a la cuenta de la cafetería', true]];
    const pays = payList.map(([id, label, sub, demo]) => {
      const on = s.pay === id;
      return { label, sub, demo, pressed: String(on), pick: () => this.setState({ pay: id }),
        style: 'display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; font: inherit; color: #1C1917; cursor: pointer; ' + (on ? 'border: 2px solid #1C1917' : 'border: 1px solid #E7E5E4'),
        radio: 'width: 20px; height: 20px; flex-shrink: 0; border-radius: 10px; box-sizing: border-box; ' + (on ? 'border: 6px solid #1C1917' : 'border: 2px solid #A8A29E') };
    });
    const slotName = slotList[s.slot][0];
    return { accent, slots, pays, isCard: s.pay === 'card',
      summary: 'Recoger: ' + (s.slot === 0 ? 'en ~10 min' : slotName),
      cta: s.pay === 'card' ? 'Pagar L 135.00 (demo)' : 'Hacer pedido' };
  }
}
</script>
</body>
</html>
