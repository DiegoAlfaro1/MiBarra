# Dispatcher: GitHub Actions can't react to board moves directly, so this checks the
# board on a schedule and starts Claude on every issue in the "Ready" column.
# You can also run it on demand: Actions tab → Claude dispatch → Run workflow,
# or `gh workflow run claude-dispatch.yml`.
name: Claude dispatch

on:
  schedule:
    # Cron hours are UTC. Honduras is UTC-6, so add 6 to the local hour.
    # Every 10 minutes, 7pm–7am Honduras time (01:00–12:59 UTC), nights starting Mon–Fri.
    # Each run counts as 1 Actions minute. Adjust to fit your schedule and minutes.
    - cron: "*/10 1-12 * * 1-6"
  workflow_dispatch:

concurrency:
  group: claude-dispatch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.CLAUDE_PAT }}
      GH_REPO: ${{ github.repository }}
      PROJECT_OWNER: ${{ vars.CLAUDE_PROJECT_OWNER }}
      PROJECT_NUMBER: ${{ vars.CLAUDE_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .claude/scripts

      - name: Start Claude on Ready issues
        run: |
          READY="$(bash .claude/scripts/board.sh list "Ready")"
          if [ -z "$READY" ]; then echo "Nothing in Ready."; exit 0; fi

          for N in $READY; do
            STATE="$(gh issue view "$N" --json state --jq .state)"
            [ "$STATE" = "OPEN" ] || { echo "#$N is closed, skipping"; continue; }

            echo "Starting #$N"
            # Move first so the next dispatcher run doesn't pick it up again
            bash .claude/scripts/board.sh set-status "$N" "In progress"
            # Remove and re-add the label so moving a card back to Ready retries it
            gh issue edit "$N" --remove-label "claude" >/dev/null 2>&1 || true
            gh issue edit "$N" --add-label "claude"
          done
